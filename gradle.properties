mod_name=Aeronautics: Fly by Instruments
mod_license=MIT
mod_version=0.4.0
mod_group_id=com.radaeli.aeronauticsflybyinstruments
mod_authors=Radaeli
mod_description=Avionics and flight instruments for Create Aeronautics.

