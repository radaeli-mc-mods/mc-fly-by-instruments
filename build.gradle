plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Opt-in server integration harness; never included in a normal release build.
if (providers.gradleProperty('tableGameTests').isPresent()) {
    sourceSets.main.java.srcDir 'src/gametest/java'
}
if (providers.gradleProperty('ponderValidation').isPresent()) {
    // Keep the opt-in harness separate from ordinary builds running in another chat/IDE.
    layout.buildDirectory = layout.projectDirectory.dir('build-ponder')
    sourceSets.main.java.srcDir 'src/ponderValidation/java'
}
if (providers.gradleProperty('ponderServerValidation').isPresent()) {
    layout.buildDirectory = layout.projectDirectory.dir('build-ponder-server')
    sourceSets.main.java.srcDir 'src/ponderServerValidation/java'
}
def preparePonderServerValidation = tasks.register('preparePonderServerValidation', Copy) {
    from 'src/gametest/structures'
    into 'run-ponder-server/gameteststructures'
}
def prepareTableGameTests = tasks.register('prepareTableGameTests', Copy) {
    from 'src/gametest/structures'
    into 'run-gametests/gameteststructures'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

// Prefer local development JARs when present and resolve published artifacts otherwise.
def configuredFile = { String propertyName ->
    def configuredPath = project.findProperty(propertyName)
    def jar = configuredPath ? project.file(configuredPath) : null
    jar?.isFile() ? jar : null
}

def createJar = configuredFile('create_jar')
def aeronauticsJar = configuredFile('aeronautics_jar')
def sableJar = configuredFile('sable_jar')
def computercraftJar = configuredFile('computercraft_jar')
def rUiLibJar = configuredFile('r_ui_lib_jar')
def ponderJsJar = configuredFile('ponderjs_jar')
def kubeJsJar = configuredFile('kubejs_jar')

def existingDependencyFiles = {
    [createJar, computercraftJar, rUiLibJar].findAll { it != null }
}

def bundledModFiles = { File localJar, String artifact ->
    if (localJar != null) {
        return files(localJar)
    }
    def publishedJar = configurations.detachedConfiguration(dependencies.create(artifact))
    publishedJar.transitive = false
    return publishedJar
}

def aeronauticsFiles = bundledModFiles(aeronauticsJar, "maven.modrinth:oWaK0Q19:${aeronautics_version_id}")
def sableFiles = bundledModFiles(sableJar, "maven.modrinth:sable:${sable_version_id}")

def aeronauticsCompileJarsDirectory = layout.buildDirectory.dir('local-mod-dependencies/aeronautics')
def sableCompileJarsDirectory = layout.buildDirectory.dir('local-mod-dependencies/sable')
def createCompileJarsDirectory = layout.buildDirectory.dir('local-mod-dependencies/create')

def extractCreateCompileJars = tasks.register('extractCreateCompileJars', Sync) {
    onlyIf { createJar != null }
    from {
        createJar == null ? files() : zipTree(createJar).matching {
            include 'META-INF/jarjar/*.jar'
        }
    }
    eachFile { path = name }
    includeEmptyDirs = false
    into(createCompileJarsDirectory)
}

// NeoForge loads nested mod JARs at runtime. Javac needs them on its classpath.
def extractBundledCompileJars = { String taskName, FileCollection archives, Provider<Directory> destination ->
    tasks.register(taskName, Sync) {
        from {
            archives.collect { archive ->
                zipTree(archive).matching { include 'META-INF/jarjar/*.jar' }
            }
        }
        eachFile { path = name }
        includeEmptyDirs = false
        into(destination)
    }
}

def extractAeronauticsCompileJars = extractBundledCompileJars(
        'extractAeronauticsCompileJars', aeronauticsFiles, aeronauticsCompileJarsDirectory)
def extractSableCompileJars = extractBundledCompileJars(
        'extractSableCompileJars', sableFiles, sableCompileJarsDirectory)

configurations {
    localRuntime
    testCompileOnly.extendsFrom compileOnly
}

dependencies {
    // Optional client tutorial integration; never bundle these libraries.
    compileOnly(ponderJsJar == null ? "curse.maven:ponder-622888:${ponderjs_file_id}" : files(ponderJsJar))
    compileOnly(kubeJsJar == null ? "maven.modrinth:kubejs:${kubejs_version_id}" : files(kubeJsJar))
    if (providers.gradleProperty('ponderTutorials').isPresent()) {
        localRuntime files([ponderJsJar, kubeJsJar, configuredFile('rhino_jar')]
                .findAll { it != null })
    } else if (providers.gradleProperty('ponderKubeOnly').isPresent()) {
        localRuntime files([kubeJsJar, configuredFile('rhino_jar')].findAll { it != null })
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    compileOnly files(existingDependencyFiles)
    if (createJar == null) {
        compileOnly("com.simibubi.create:create-${minecraft_version}:${create_maven_version}:slim") {
            transitive = false
        }
        compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
        compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
        compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
        localRuntime("com.simibubi.create:create-${minecraft_version}:${create_maven_version}") {
            transitive = false
        }
    } else {
        compileOnly files { fileTree(createCompileJarsDirectory.get().asFile) { include '*.jar' } }
    }
    compileOnly files(aeronauticsFiles, sableFiles)
    if (computercraftJar == null) {
        compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${computercraft_api_version}")
        compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${computercraft_api_version}")
        compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${computercraft_api_version}")
        localRuntime("maven.modrinth:cc-tweaked:${computercraft_runtime_version}")
    }
    if (rUiLibJar == null) {
        def rUiLibArtifact = "curse.maven:r-ui-lib-1731287:${r_ui_lib_file_id}"
        compileOnly(rUiLibArtifact)
        localRuntime(rUiLibArtifact)
    }
    compileOnly files { fileTree(aeronauticsCompileJarsDirectory.get().asFile) { include '*.jar' } }
    compileOnly files { fileTree(sableCompileJarsDirectory.get().asFile) { include '*.jar' } }

    // These are development-only runtime inputs. The addon JAR never bundles
    // Create, Aeronautics, Sable, CC:Tweaked, or R-Ui Lib.
    localRuntime files(existingDependencyFiles, aeronauticsFiles, sableFiles)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        ponderValidationServer {
            server()
            gameDirectory = file('run-ponder-server')
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore preparePonderServerValidation
        }
        ponderValidationClient {
            client()
            gameDirectory = file('run-ponder')
            programArgument '--quickPlaySingleplayer'
            programArgument 'Ponder Validation'
        }
        client {
            client()
            // The ordinary client discovers optional tutorial mods in run/mods.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--quickPlaySingleplayer'
            programArgument 'New World'
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            server()
            gameDirectory = file('run-gametests')
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore prepareTableGameTests
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = name.startsWith('ponderValidation') ? org.slf4j.event.Level.INFO : org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods[mod_id]
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version          : minecraft_version,
        minecraft_version_range    : minecraft_version_range,
        neo_version                : neo_version,
        loader_version_range       : loader_version_range,
        mod_id                     : mod_id,
        mod_name                   : mod_name,
        mod_license                : mod_license,
        mod_version                : mod_version,
        mod_authors                 : mod_authors,
        mod_description            : mod_description,
        create_version_range       : create_version_range,
        aeronautics_version_range  : aeronautics_version_range,
        sable_version_range        : sable_version_range,
        computercraft_version_range: computercraft_version_range,
        r_ui_lib_version_range     : r_ui_lib_version_range,
        ponderjs_version_range     : ponderjs_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    dependsOn(extractCreateCompileJars)
    dependsOn(extractAeronauticsCompileJars, extractSableCompileJars)
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}


publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
